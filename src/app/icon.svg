<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1040"/>
      <stop offset="1" stop-color="#3b0d6e"/>
    </linearGradient>
    <linearGradient id="hgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <!-- Gradiente del borde, multicolor y giratorio -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"
      gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#00e5ff"/>
      <stop offset="0.25" stop-color="#7c4dff"/>
      <stop offset="0.5"  stop-color="#ff2d95"/>
      <stop offset="0.75" stop-color="#ffea00"/>
      <stop offset="1"    stop-color="#00e676"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="#7c4dff" opacity="0.14"/>

  <!-- Borde multicolor alrededor de todo el icono -->
  <rect x="24" y="24" width="464" height="464" rx="108"
        fill="none" stroke="url(#border)" stroke-width="16"/>

  <!-- H totalmente sólida (una sola pieza) -->
  <path d="M128 120 H192 V224 H320 V120 H384 V392 H320 V288 H192 V392 H128 Z"
        fill="url(#hgrad)" stroke="url(#hgrad)" stroke-width="24"
        stroke-linejoin="round" filter="url(#glow)"/>
</svg>
